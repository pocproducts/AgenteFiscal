# frontend/fly.toml — Next.js standalone de Agente Fiscal
#
# IMPORTANTE (monorepo): el build context es la RAÍZ del repo porque Next.js
# pertenece al pnpm-workspace. Deployar desde la raíz:
#   fly deploy . --config frontend/fly.toml
# El [build].dockerfile es relativo al working directory (la raíz).
# No usar: fly deploy ./frontend  ← el contexto quedaría sin pnpm-workspace.yaml

app = "agente-fiscal-frontend"
primary_region = "eze"

[build]
  dockerfile = "frontend/Dockerfile"
  [build.args]
    NEXT_PUBLIC_BASE_PATH = ""
    IS_DEMO = "0"
    NEXT_PUBLIC_SENTRY_DSN = ""
    # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY es pública (pk_...) y se inyecta en el
    # bundle en build time. Pasarla en cada deploy:
    #   fly deploy . --config frontend/fly.toml \
    #     --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_xxx

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/ping"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024