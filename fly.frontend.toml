# fly.frontend.toml — Next.js standalone de Agente Fiscal (config MONOREPO en raíz)
#
# IMPORTANTE: este config vive en la RAÍZ porque el build del frontend necesita
# contexto = raíz del repo (pnpm-workspace.yaml + backend/package.json). Fly
# resuelve el dockerfile RELATIVO al directorio del config, así que
# frontend/fly.toml con dockerfile="frontend/Dockerfile" NO funciona.
#
# Deploy:
#   fly deploy . --config fly.frontend.toml --auto-confirm \
#     --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_xxx \
#     --build-arg NEXT_PUBLIC_SENTRY_DSN=...
#
# (frontend/fly.toml quedó obsoleto: usar este.)

app = "agente-fiscal-frontend"
primary_region = "gru"

[build]
  dockerfile = "frontend/Dockerfile"
  [build.args]
    NEXT_PUBLIC_BASE_PATH = ""
    IS_DEMO = "0"
    NEXT_PUBLIC_SENTRY_DSN = ""
    # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY es pública (pk_...) y se inyecta en el
    # bundle en build time. Pasarla en cada deploy con --build-arg.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/ping"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024