[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agente-fiscal"
version = "0.1.0"
description = "Agente Fiscal — calendarios de vencimientos ARCA, pipeline, API y CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "starlette>=0.38",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "requests>=2.32",
    "httpx>=0.27",
    "redis>=5.0",
    "reportlab>=4.0",
    "mcp>=1.0,<2.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "sentry-sdk>=2.68.0",
]

[project.scripts]
agente-fiscal = "agente_fiscal.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["agente_fiscal"]

[tool.hatch.build.targets.sdist]
include = ["agente_fiscal"]

[tool.coverage.run]
# greenlet: SQLAlchemy asyncio; thread: asyncio.to_thread in worker/runner.py
concurrency = ["greenlet", "thread"]

[tool.pytest.ini_options]
testpaths = ["agente_fiscal/tests"]
asyncio_mode = "auto"
addopts = "--cov=agente_fiscal --cov-report=term-missing"
