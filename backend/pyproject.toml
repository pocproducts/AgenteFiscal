[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiscal-agent"
version = "0.1.0"
description = "Vertical AI Agent Fiscal — calendarios de vencimientos ARCA, pipeline, API y CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "starlette>=0.38",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "requests>=2.32",
    "httpx>=0.27",
    "redis>=5.0",
    "reportlab>=4.0",
    "mcp>=1.0,<2.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.scripts]
fiscal-agent = "fiscal_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["fiscal_agent"]

[tool.hatch.build.targets.sdist]
include = ["fiscal_agent"]

[tool.pytest.ini_options]
testpaths = ["fiscal_agent/tests"]
asyncio_mode = "auto"
