# backend/fly.toml — API FastAPI de Agente Fiscal
#   fly launch --no-deploy --name agente-fiscal-backend --region eze
#   fly secrets set ...   (ver doc en backend/.env.example)
#   fly deploy
#
# El worker corre in-process dentro de uvicorn (--workers 2) — un solo
# contenedor ejecuta API + worker. El reclamo FOR UPDATE SKIP LOCKED
# permite escalar a 2+ máquinas sin doble ejecución.

app = "agente-fiscal-backend"
primary_region = "eze"

[deploy]
  # Corre Alembic en una MV temporal antes de liberar el release.
  release_command = "alembic upgrade head"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024